# The app itself is in package.json. This is for the maintainer tools in tools/ (the monthly
# WCA reference rebuild) and the docs checks, run with: uv run --dev pytest
[project]
name = "lookahead"
version = "4.2.0"
description = "Maintainer tools for Lookahead, a speedcubing timer and training tracker that works offline."
readme = "README.md"
license = "MIT"
authors = [{ name = "Viet Ha Ly" }]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
default-groups = []
package = false

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
addopts = "-rfEs --strict-markers"
