version: 2
updates:
  - package-ecosystem: npm
    directory: /pwa
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # Node's types follow the Node version the app runs on (pwa/.node-version). Raise both
      # together by hand.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
