# Runs the tests on every push and pull request, on all three systems the app supports, with
# the oldest Python that still gets security fixes (3.11) and the newest stable one (3.14).
# The browser smoke test runs once, on Ubuntu. The WCA reference workflow starts it by hand
# (workflow_dispatch) on the pull requests it opens, since its pushes can't start it.
name: Tests

on:
  # The phone app in pwa/ has its own workflow (pwa.yml).
  push:
    paths-ignore: ['pwa/**', '.github/workflows/pwa.yml']
  pull_request:
    paths-ignore: ['pwa/**', '.github/workflows/pwa.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # --locked fails the run if uv.lock is out of step with pyproject.toml
      - run: uv run --locked --dev pytest

  browser:
    name: Browser smoke test (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv run --locked --group e2e playwright install --with-deps chromium
      - run: uv run --locked --group e2e pytest -m e2e
