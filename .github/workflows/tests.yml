# Runs the tests on every push and pull request, on all three systems the app supports, with
# the oldest and newest Python it's tested on. The browser smoke test runs once, on Ubuntu.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # --locked fails the run if uv.lock is out of step with pyproject.toml
      - run: uv run --locked pytest

  browser:
    name: Browser smoke test (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv run --locked --group e2e playwright install --with-deps chromium
      - run: uv run --locked --group e2e pytest -m e2e
